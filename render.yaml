services:
  - type: web
    name: backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3000

  - type: static
    name: frontend
    staticPublishPath: dist
    rootDir: frontend
    buildCommand: npm install && npm run build
    envVars:
      - key: VITE_API_BASE_URL
        value: https://your-app-backend.onrender.com/api

databases:
  - name: postgres
    databaseName: your_app_db
    user: postgres
    plan: free
